<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanmay Deep Sharma - Technical Expertise Enhanced</title>
    <meta name="description" content="Interactive visualization of technical skills with modern UX design">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #6c63ff;
            --secondary-color: #a29bfe;
            --bg-dark: #0a0e27;
            --bg-card: #141b3a;
            --bg-card-hover: #1a2244;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --accent-green: #48bb78;
            --accent-blue: #4299e1;
            --accent-purple: #9f7aea;
            --accent-pink: #ed64a6;
            --accent-orange: #ed8936;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 15px 50px rgba(108, 99, 255, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #0f1419 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header Section */
        .section-header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 0.8s ease-out;
        }

        .section-title {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-subtitle {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--text-secondary);
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.8;
        }

        /* Filter Buttons */
        .filter-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 50px;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .filter-btn {
            padding: 12px 28px;
            background: var(--bg-card);
            border: 2px solid transparent;
            border-radius: 30px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .filter-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: radial-gradient(circle, var(--primary-color), transparent);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .filter-btn:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(108, 99, 255, 0.3);
        }

        .filter-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-color: var(--primary-color);
            box-shadow: 0 8px 25px rgba(108, 99, 255, 0.4);
        }

        .filter-btn span {
            position: relative;
            z-index: 1;
        }

        /* Skills Grid */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 60px;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .category-section {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 32px;
            border: 1px solid rgba(108, 99, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .category-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-blue), var(--primary-color));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.5s ease;
        }

        .category-section:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(108, 99, 255, 0.3);
        }

        .category-section:hover::before {
            transform: scaleX(1);
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .category-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            animation: pulse 2s infinite;
        }

        .category-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Skill Cards */
        .skill-item {
            margin-bottom: 20px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .skill-item:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateX(8px);
        }

        .skill-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .skill-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .skill-icon {
            font-size: 20px;
        }

        .skill-years {
            font-size: 0.9rem;
            color: var(--text-secondary);
            background: rgba(108, 99, 255, 0.2);
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 600;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-blue), var(--primary-color));
            border-radius: 10px;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            animation: shimmer 2s infinite;
        }

        .skill-level {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 6px;
            font-weight: 500;
        }

        /* Stats Cards */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
            margin-top: 50px;
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 32px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(108, 99, 255, 0.1);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(108, 99, 255, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: var(--shadow-hover);
            border-color: rgba(108, 99, 255, 0.3);
        }

        .stat-number {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Tooltip */
        .tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: var(--bg-dark);
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
            border: 1px solid rgba(108, 99, 255, 0.3);
            z-index: 10;
        }

        .skill-item:hover .tooltip {
            opacity: 1;
            transform: translateX(-50%) translateY(-5px);
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(108, 99, 255, 0.7);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(108, 99, 255, 0);
            }
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .section-title {
                font-size: 2rem;
            }

            .skills-grid {
                grid-template-columns: 1fr;
            }

            .filter-container {
                gap: 8px;
            }

            .filter-btn {
                padding: 10px 20px;
                font-size: 14px;
            }

            .category-section {
                padding: 24px;
            }
        }

        /* Navigation Back Button */
        .back-nav {
            text-align: center;
            margin-bottom: 40px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: var(--bg-card);
            border: 2px solid var(--primary-color);
            border-radius: 30px;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(108, 99, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-nav">
            <a href="https://tanmaydeepsharma.com" class="back-btn">
                <span>←</span>
                <span>Back to Main Site</span>
            </a>
        </div>

        <header class="section-header">
            <h1 class="section-title">Technical Expertise</h1>
            <p class="section-subtitle">
                Interactive visualization of my technical skills across different domains.
                Hover over skills for detailed insights and click categories to filter.
            </p>
        </header>

        <div class="filter-container" id="filterContainer">
            <button class="filter-btn active" data-category="all">
                <span>All Skills</span>
            </button>
            <button class="filter-btn" data-category="languages">
                <span>Languages</span>
            </button>
            <button class="filter-btn" data-category="aiml">
                <span>AI/ML</span>
            </button>
            <button class="filter-btn" data-category="backend">
                <span>Backend</span>
            </button>
            <button class="filter-btn" data-category="cloud">
                <span>Cloud/DevOps</span>
            </button>
            <button class="filter-btn" data-category="data">
                <span>Data</span>
            </button>
        </div>

        <div class="skills-grid" id="skillsGrid"></div>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-number">25+</div>
                <div class="stat-label">Technologies Mastered</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">4.5+</div>
                <div class="stat-label">Years of Experience</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">15+</div>
                <div class="stat-label">AI/ML Projects</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">5</div>
                <div class="stat-label">Tech Domains</div>
            </div>
        </div>
    </div>

    <script>
        // Skills data structure
        const skillsData = {
            languages: {
                title: 'Languages',
                icon: '💻',
                color: '--accent-blue',
                skills: [
                    { name: 'Python', years: 4.5, level: 'Expert', proficiency: 95 },
                    { name: 'Java', years: 3, level: 'Advanced', proficiency: 80 },
                    { name: 'JavaScript', years: 2, level: 'Advanced', proficiency: 75 },
                    { name: 'TypeScript', years: 1.5, level: 'Intermediate', proficiency: 70 }
                ]
            },
            aiml: {
                title: 'AI/ML',
                icon: '🤖',
                color: '--accent-purple',
                skills: [
                    { name: 'LLMs', years: 2, level: 'Advanced', proficiency: 85 },
                    { name: 'AI Agents', years: 1.5, level: 'Advanced', proficiency: 80 },
                    { name: 'MCP (Model Context Protocol)', years: 1, level: 'Intermediate', proficiency: 70 },
                    { name: 'Gateway Orchestration', years: 1.5, level: 'Advanced', proficiency: 75 },
                    { name: 'n8n Workflow Automation', years: 1, level: 'Intermediate', proficiency: 65 }
                ]
            },
            backend: {
                title: 'Backend',
                icon: '⚙️',
                color: '--accent-green',
                skills: [
                    { name: 'FastAPI', years: 3, level: 'Expert', proficiency: 90 },
                    { name: 'Flask', years: 4, level: 'Expert', proficiency: 95 },
                    { name: 'Django', years: 2, level: 'Advanced', proficiency: 75 },
                    { name: 'REST APIs', years: 4.5, level: 'Expert', proficiency: 95 }
                ]
            },
            cloud: {
                title: 'Cloud/DevOps',
                icon: '☁️',
                color: '--accent-orange',
                skills: [
                    { name: 'AWS', years: 3, level: 'Advanced', proficiency: 85 },
                    { name: 'Docker', years: 2.5, level: 'Advanced', proficiency: 80 },
                    { name: 'Terraform', years: 2, level: 'Intermediate', proficiency: 70 },
                    { name: 'Kubernetes', years: 1.5, level: 'Intermediate', proficiency: 65 },
                    { name: 'Vector Databases', years: 1.5, level: 'Advanced', proficiency: 75 },
                    { name: 'AI Infrastructure', years: 2, level: 'Advanced', proficiency: 80 }
                ]
            },
            data: {
                title: 'Data',
                icon: '📊',
                color: '--accent-pink',
                skills: [
                    { name: 'PostgreSQL', years: 3.5, level: 'Expert', proficiency: 90 },
                    { name: 'Elasticsearch', years: 3, level: 'Advanced', proficiency: 85 },
                    { name: 'Redis', years: 2.5, level: 'Advanced', proficiency: 80 },
                    { name: 'MongoDB', years: 2, level: 'Advanced', proficiency: 75 },
                    { name: 'RAG Systems', years: 1.5, level: 'Advanced', proficiency: 80 },
                    { name: 'Embedding Models', years: 2, level: 'Advanced', proficiency: 85 }
                ]
            }
        };

        // Render skills function
        function renderSkills(category = 'all') {
            const grid = document.getElementById('skillsGrid');
            grid.innerHTML = '';

            const categoriesToRender = category === 'all'
                ? Object.keys(skillsData)
                : [category];

            categoriesToRender.forEach(catKey => {
                const category = skillsData[catKey];
                const section = document.createElement('div');
                section.className = 'category-section';
                section.setAttribute('data-category', catKey);

                const skillsHTML = category.skills.map(skill => `
                    <div class="skill-item">
                        <div class="tooltip">
                            ${skill.level} - ${skill.proficiency}% proficiency
                        </div>
                        <div class="skill-header">
                            <div class="skill-name">
                                <span class="skill-icon">${getSkillIcon(skill.name)}</span>
                                ${skill.name}
                            </div>
                            <div class="skill-years">${skill.years}y</div>
                        </div>
                        <div class="progress-container">
                            <div class="progress-bar" style="width: 0%" data-width="${skill.proficiency}%"></div>
                        </div>
                        <div class="skill-level">${skill.level}</div>
                    </div>
                `).join('');

                section.innerHTML = `
                    <div class="category-header">
                        <div class="category-icon">${category.icon}</div>
                        <h3 class="category-title">${category.title}</h3>
                    </div>
                    ${skillsHTML}
                `;

                grid.appendChild(section);
            });

            // Animate progress bars
            setTimeout(() => {
                const progressBars = document.querySelectorAll('.progress-bar');
                progressBars.forEach((bar, index) => {
                    setTimeout(() => {
                        bar.style.width = bar.getAttribute('data-width');
                    }, index * 50);
                });
            }, 100);
        }

        // Get icon for specific skills
        function getSkillIcon(skillName) {
            const icons = {
                'Python': '🐍',
                'Java': '☕',
                'JavaScript': '🟨',
                'TypeScript': '🔷',
                'LLMs': '🧠',
                'AI Agents': '🤖',
                'FastAPI': '⚡',
                'Flask': '🌶️',
                'Django': '🎸',
                'AWS': '☁️',
                'Docker': '🐳',
                'PostgreSQL': '🐘',
                'Elasticsearch': '🔍',
                'Redis': '🔴',
                'MongoDB': '🍃'
            };
            return icons[skillName] || '⭐';
        }

        // Filter functionality
        const filterButtons = document.querySelectorAll('.filter-btn');
        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                const category = button.getAttribute('data-category');

                // Update active state
                filterButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');

                // Render filtered skills
                renderSkills(category);
            });
        });

        // Initial render
        renderSkills();

        // Intersection Observer for scroll animations
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);

        // Observe category sections
        document.querySelectorAll('.category-section').forEach(section => {
            observer.observe(section);
        });
    </script>
</body>
</html>
